<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>openGrid Tile Studio</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <aside id="panel">
    <header>
      <h1>openGrid Tile Studio</h1>
      <div class="actions">
        <button id="export" class="primary" disabled>Open in Bambu Studio</button>
      </div>
      <div class="connectors">
        <button id="printConnectors">Print</button>
        <select id="connectorCount" aria-label="Number of connectors"></select>
        <span>connectors</span>
      </div>
      <label class="printer">Printer <select id="printer"></select></label>
    </header>
    <section id="colorPanel">
      <h2>Filament <span id="colorName"></span></h2>
      <div id="colors"></div>
    </section>
    <form id="params"></form>
    <footer>
      <div id="status">Loading…</div>
      <pre id="log"></pre>
    </footer>
  </aside>
  <main id="viewer"><button id="topview" title="Look straight down (matches the diagram in the panel)">Top view</button><div id="spinner" hidden aria-live="polite" aria-label="Rendering"><span></span>Rendering</div></main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
