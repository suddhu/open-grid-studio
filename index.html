<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>openGrid Tile Studio</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <aside id="panel">
    <header>
      <h1>openGrid Tile Studio</h1>
      <div class="actions">
        <button id="export" class="primary" disabled>Open in Bambu Studio</button>
      </div>
      <div class="connectors">
        <button id="printParts" disabled>Print parts</button>
        <span id="partsSummary">no parts placed</span>
      </div>
      <div class="connectors">
        <button id="printConnectors">Print</button>
        <select id="connectorCount" aria-label="Number of connectors"></select>
        <span>connectors</span>
      </div>
      <label class="printer">Printer <select id="printer"></select></label>
    </header>
    <section id="partsPanel">
      <h2>Parts</h2>
      <p class="hint">Add a Multiconnect part, then click a cell on the board to place it. Drag to move, click to select, Delete to remove.</p>
      <div id="partPalette"></div>
      <ul id="partList"></ul>
      <div id="partEditor" hidden>
        <div class="partEditorHead"><strong id="partEditorName"></strong><button id="deletePart" type="button">Delete</button></div>
        <form id="partParams"></form>
      </div>
    </section>
    <form id="params"></form>
    <footer>
      <div id="status">Loading…</div>
      <pre id="log"></pre>
    </footer>
  </aside>
  <main id="viewer">
    <div id="viewerTools">
      <button id="topview" title="Look straight down">Top view</button>
      <button id="measure" title="Click two points to measure (Esc to clear)">Measure</button>
      <select id="measureUnit" aria-label="Measurement unit" hidden><option value="mm">mm</option><option value="in">inches</option></select>
    </div><div id="spinner" hidden aria-live="polite" aria-label="Rendering"><span></span>Rendering</div></main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
